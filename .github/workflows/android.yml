# Construit l'appli Android de Lumi (un fichier .apk) sur les serveurs de GitHub.
# - Sur une demande de fusion (pull request) : l'APK est téléchargeable dans l'onglet
#   « Actions », rubrique « Artifacts ».
# - Sur la branche main : l'APK est publié à une adresse fixe, à ouvrir sur le téléphone :
#   https://github.com/Tehau987/Lumi-vivant/releases/latest/download/lumi-vivant.apk
name: Appli Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tests des règles de vie
        run: node tests/vie.test.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Construire l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../lumi-vivant.apk

      - uses: actions/upload-artifact@v4
        with:
          name: lumi-vivant-apk
          path: lumi-vivant.apk

      - name: Publier l'APK (branche main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android --yes --cleanup-tag || true
          gh release create android lumi-vivant.apk \
            --target "$GITHUB_SHA" --latest \
            --title "Lumi Vivant pour Android" \
            --notes "La dernière version de l'appli Android, construite depuis main. Ouvre ce lien sur ton téléphone pour l'installer : https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/lumi-vivant.apk"
